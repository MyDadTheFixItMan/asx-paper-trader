name: Backtest 10y daily

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python bot/backtest_daily.py
        env:
          PYTHONWARNINGS: ignore
      - name: Save results
        run: |
          git config user.name "asx-paper-trader"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet && exit 0
          git commit -m "Backtest results $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
