name: Paper trader

# One job runs the trader every 5 minutes for the whole trading day, so GitHub's
# scheduler only needs to start it once. Extra starts are backups: they queue and
# exit fast if the day is already handled.
on:
  schedule:
    - cron: "7 22 * * 0-4"     # ~9:07 AEDT / 8:07 AEST (Mon-Fri Sydney)
    - cron: "7 0,2,4 * * 1-5"  # backups through the day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Trade every 5 minutes until the day is done
        env:
          PYTHONWARNINGS: ignore
        run: |
          git config user.name "asx-paper-trader"
          git config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          while true; do
            git pull -q --rebase origin main || true
            python bot/trader.py || echo "cycle failed, will retry"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Trader update $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
              git pull -q --rebase origin main && git push -q || echo "push failed, will retry"
            fi
            hm=$(TZ=Australia/Sydney date +%H%M); dow=$(TZ=Australia/Sydney date +%u)
            phase=$(python -c "import json;print(json.load(open('data/state.json'))['day'].get('phase',''))" 2>/dev/null)
            [ "$dow" -ge 6 ] && break
            [ "$hm" -ge 1700 ] && break
            [ "$phase" = "closed" ] && [ "$hm" -ge 1000 ] && break
            [ $(( $(date +%s) - start )) -gt 20400 ] && break   # stop before the 6h job limit
            sleep $(( 300 - $(date +%s) % 300 + 5 ))            # wake on the next 5-minute mark
          done
